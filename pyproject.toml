[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "briefing-intelligence-engine"
version = "0.1.0"
description = "FastAPI intelligence layer for executive briefing scoring, narrative generation, and action sequencing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Mirza Causevic" }
]
dependencies = [
  "fastapi>=0.116.0,<0.117.0",
  "uvicorn>=0.35.0,<0.47.0",
  "pandas>=2.3.0,<2.4.0",
  "pydantic>=2.11.0,<2.14.0",
  "python-dotenv>=1.1.0,<1.2.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0,<0.29.0",
  "pytest>=8.4.0,<8.5.0",
  "pytest-cov>=6.2.0,<6.3.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
